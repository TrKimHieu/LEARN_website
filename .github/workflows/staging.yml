name: staging-release
on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        options: [web]
        required: true
      image:
        description: Tested ghcr.io image with sha256 digest
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: staging-${{ inputs.service }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: node scripts/deploy/staging.mjs --apply
        env:
          DEPLOY_SERVICE: ${{ inputs.service }}
          DEPLOY_IMAGE: ${{ inputs.image }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          STAGING_INSTANCE_ID: ${{ vars[format('STAGING_{0}_INSTANCE_ID', inputs.service)] }}
