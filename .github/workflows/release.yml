name: release
# Merge to main: test, build the image once, deploy to staging, then promote the same digest to
# production after approval. Production stays off until PRODUCTION_ENABLED is 'true'.
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
    outputs:
      web: ${{ env.REGISTRY }}/learn/web@${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: false
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      # NEXT_PUBLIC_API_URL stays empty: the browser calls relative /api paths behind Caddy (ADR 017).
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/learn/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  staging:
    needs: image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      web_image: ${{ needs.image.outputs.web }}

  # Required reviewers on the `production` GitHub environment hold this job until approved.
  production:
    needs: [image, staging]
    if: vars.PRODUCTION_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      web_image: ${{ needs.image.outputs.web }}
