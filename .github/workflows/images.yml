name: immutable-images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        service: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ github.sha }}
          build-args: NEXT_PUBLIC_API_URL=${{ vars.API_ORIGIN }}
      - name: Release evidence
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-${{ matrix.service }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.txt
