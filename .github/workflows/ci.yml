name: web-ci
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run test:tooling && npm run build
